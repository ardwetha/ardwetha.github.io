  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 300); background: oklch(0.7 0.19 300 / 0.08);\">YouTube<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"About\" id=\"about\" data-reveal=\"\" style=\"position: relative; z-index: 2; max-width: 780px; margin: 0 auto; padding: 8vh 6vw; opacity: {{ revealed.about }}; transform: {{ aboutTransform }}; transition: opacity 0.8s ease-out, transform 0.8s ease-out;\">\n    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.65 0.15 300); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px;\">01 / About<\u002Fdiv>\n    <p style=\"font-size: clamp(19px, 2.4vw, 24px); line-height: 1.65; color: oklch(0.86 0.01 300); font-weight: 400; margin: 0;\">I'm a student who likes building small, focused software — from tiny servers to weekend experiments. I write things down, ship what works, and try to keep it simple.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Projects\" id=\"projects\" data-reveal=\"\" style=\"position: relative; z-index: 2; max-width: 900px; margin: 0 auto; padding: 8vh 6vw; opacity: {{ revealed.projects }}; transform: {{ projectsTransform }}; transition: opacity 0.8s ease-out, transform 0.8s ease-out;\">\n    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.65 0.15 300); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 24px;\">02 / Projects<\u002Fdiv>\n\n    <a href=\"https://github.com/ardwetha/NiceBlog\" target=\"_blank\" rel=\"noopener\" style=\"display: block; text-decoration: none; color: inherit; padding: 32px; border-radius: 16px; background: oklch(0.19 0.03 300 / 0.6); border: 1px solid oklch(0.32 0.05 300); transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;\" style-hover=\"transform: translateY(-4px); border-color: oklch(0.6 0.18 300); box-shadow: 0 12px 40px oklch(0.5 0.2 300 / 0.25);\">\n      <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap;\">\n        <h3 style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 22px; color: oklch(0.92 0.02 300); font-weight: 700;\">NiceBlog<\u002Fh3>\n        <span style=\"font-size: 13px; color: oklch(0.65 0.02 300); font-family: 'JetBrains Mono', monospace;\">Python · Flask<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin: 14px 0 0; color: oklch(0.75 0.015 300); font-size: 16px; line-height: 1.6;\">A very small and simple microblog server — drop markdown-style articles in a folder and it builds the blog for you.<\u002Fp>\n      <span style=\"display: inline-flex; align-items: center; gap: 6px; margin-top: 18px; font-size: 14px; color: oklch(0.72 0.17 300); font-weight: 600;\">View on GitHub →<\u002Fspan>\n    <\u002Fa>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Contact\" id=\"contact\" data-reveal=\"\" style=\"position: relative; z-index: 2; max-width: 780px; margin: 0 auto; padding: 8vh 6vw 16vh; text-align: center; opacity: {{ revealed.contact }}; transform: {{ contactTransform }}; transition: opacity 0.8s ease-out, transform 0.8s ease-out;\">\n    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.65 0.15 300); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px;\">03 / Contact<\u002Fdiv>\n    <h2 style=\"font-size: clamp(28px, 4vw, 42px); margin: 0 0 30px; font-weight: 600; color: oklch(0.92 0.01 300);\">Find me around the web<\u002Fh2>\n    <div style=\"display: flex; gap: 18px; justify-content: center; flex-wrap: wrap;\">\n      <a href=\"https://github.com/ardwetha\" target=\"_blank\" rel=\"noopener\" style=\"padding: 14px 30px; border-radius: 100px; background: oklch(0.22 0.03 300); border: 1px solid oklch(0.35 0.06 300); color: oklch(0.9 0.01 300); text-decoration: none; font-weight: 600; font-family: 'JetBrains Mono', monospace; font-size: 14px; transition: box-shadow 0.3s, border-color 0.3s;\" style-hover=\"box-shadow: 0 0 22px oklch(0.6 0.2 300 / 0.45); border-color: oklch(0.65 0.18 300);\">github.com/ardwetha<\u002Fa>\n      <a href=\"https://www.youtube.com/@Zacuue-q2t\" target=\"_blank\" rel=\"noopener\" style=\"padding: 14px 30px; border-radius: 100px; background: oklch(0.22 0.03 300); border: 1px solid oklch(0.35 0.06 300); color: oklch(0.9 0.01 300); text-decoration: none; font-weight: 600; font-family: 'JetBrains Mono', monospace; font-size: 14px; transition: box-shadow 0.3s, border-color 0.3s;\" style-hover=\"box-shadow: 0 0 22px oklch(0.6 0.2 300 / 0.45); border-color: oklch(0.65 0.18 300);\">@ardwetha<\u002Fa>\n    <\u002Fdiv>\n    <p style=\"margin-top: 60px; font-size: 13px; color: oklch(0.5 0.02 300); font-family: 'JetBrains Mono', monospace;\">© 2026 ardwetha<\u002Fp>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nfunction seededParticles() {\n  const colors = ['oklch(0.6 0.2 300 / 0.9)', 'oklch(0.55 0.18 310 / 0.85)', 'oklch(0.5 0.15 290 / 0.8)', 'oklch(0.45 0.12 300 / 0.7)'];\n  const arr = [];\n  for (let i = 0; i < 26; i++) {\n    const seed = i * 137.5;\n    const left = (seed % 100);\n    const size = 4 + (i % 5) * 2.5;\n    const duration = 4 + (i % 6) * 1.1;\n    const delay = (i * 0.37) % 6;\n    const rise = -(280 + (i % 7) * 60);\n    const color = colors[i % colors.length];\n    arr.push({ left, size, duration, delay, rise, color });\n  }\n  return arr;\n}\n\nclass Component extends DCLogic {\n  state = {\n    revealed: { about: 0, projects: 0, contact: 0 },\n  };\n\n  componentDidMount() {\n    this._observer = new IntersectionObserver((entries) => {\n      entries.forEach((entry) => {\n        if (entry.isIntersecting) {\n          const id = entry.target.id;\n          this.setState((s) => ({ revealed: { ...s.revealed, [id]: 1 } }));\n        }\n      });\n    }, { threshold: 0.2 });\n\n    this.props ? null : null;\n    document.querySelectorAll('[data-reveal]').forEach((el) => this._observer.observe(el));\n  }\n\n  componentWillUnmount() {\n    if (this._observer) this._observer.disconnect();\n  }\n\n  renderVals() {\n    const r = this.state.revealed;\n    const transform = (v) => (v ? 'translateY(0)' : 'translateY(28px)');\n    return {\n      particles: seededParticles(),\n      revealed: r,\n      aboutTransform: transform(r.about),\n      projectsTransform: transform(r.projects),\n      contactTransform: transform(r.contact),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
